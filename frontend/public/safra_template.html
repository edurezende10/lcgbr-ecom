<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulação de Layout</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 320px;
      height: 540px;
      background-color: #fff;
      border-radius: 4px;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      width: 100%;
      height: 80px;
      background-color: #738290;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .footer {
      font-size: 10px;
      color: #738290;
      margin-top: 20px;
    }

    #banner_01 {
      background-color:#888;
    }
    #banner_02 {
      background-color:ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="banner_01" class="card"></div>
    <div id="banner_02" class="card"></div>
  </div>
</body>
</html>

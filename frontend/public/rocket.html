    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Estilos para a legenda de status */
        .status-nao-iniciado { background-color: #e2e8f0; border-color: #94a3b8; } /* cinza */
        .status-em-andamento { background-color: #60a5fa; border-color: #2563eb; } /* azul */
        .status-realizado { background-color: #4ade80; border-color: #16a34a; } /* verde */
        .status-critico { background-color: #393939; border-color: #000000; } /* preto */
        .status-atrasado { background-color: #f87171; border-color: #dc2626; } /* vermelho */

        /* Estilos para os eixos */
        .axis-label {
            position: absolute;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            z-index: 1;
        }

        .data-axis {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .agilidade-axis {
            bottom: 50%;
            left: 0px;
            transform: rotate(-90deg) translateX(50%);
            transform-origin: left center;
        }
        
        /* Legendas dos pontos (alternadas) */
        .point-label-above, .point-label-below {
            position: absolute;
            font-size: 0.65rem;
            color: #475569;
            width: 170px;
            line-height: 1.2;
            pointer-events: none;
        }

        .point-label-above {
            text-align: left;
            /*transform-origin: top left;*/
            transform-origin: 10px -10px;
            transform: rotate(-65deg) translate(15px, -20px);
        }

        .point-label-below {
            text-align: right;
            transform-origin: 85px 150px;
            transform: rotate(-65deg) translate(-15px, 20px);
        }
        
        /* Título principal da fase no gráfico */
        .main-stage-title {
            position: absolute;
            font-size: 0.9rem;
            font-weight: bold;
            color: #0ea5e9;
            text-transform: uppercase;
            transform: translateX(-50%);
            width: 160px;
        }

        /* Linha tracejada divisória */
        .stage-delimiter {
            position: absolute;
            border-left: 2px dashed #d1d5db;
            height: 200px; /* Aumentado para melhor visualização */
            transform: translateX(-50%);
        }

        .rocket {
            font-size: 3rem;
            position: absolute;
            z-index: 5;
        }

    </style>

        const statusOptions = {

            'em-andamento': { label: 'Em Andamento', class: 'status-em-andamento' },

            'critico': { label: 'Crítico', class: 'status-critico' }

        //const stages = ['Proprietary Data Organization (1st. party data)', 'Foundation and Modernization of the Data Architecture', 'Analytics, Insights and Data Analytics', 'Audience Segmentation and Activation', 'Personalization at scale', 'Conversion and LTV Optimization'];
        var stages = [];
        stages.push("Organização de Dados");

        stages.push("Diagnóstico");
        stages.push("Descritivo");
        stages.push("Preditivo");
        stages.push("Prescritivo");

        // --- ELEMENTOS DO DOM ---
        const capabilitiesListContainer = document.getElementById('capabilities-list');
        const graphCanvas = document.getElementById('graph-canvas');
        const roadmapPointsContainer = document.getElementById('roadmap-points');

        // --- FUNÇÕES DE RENDERIZAÇÃO ---

        function renderCapabilitiesList() {
            const groupedByStage = capabilitiesData.reduce((acc, item) => {
                acc[item.stage] = acc[item.stage] || [];
                acc[item.stage].push(item);
                return acc;
            }, {});

            capabilitiesListContainer.innerHTML = ''; 
            
            stages.forEach(stageName => {
                if (groupedByStage[stageName]) {
                    const stageDiv = document.createElement('div');
                    stageDiv.innerHTML = `<h3 class="text-lg font-semibold text-sky-600 border-b-2 border-sky-200 pb-2 mb-3">${stageName}</h3>`;
                    
                    groupedByStage[stageName].forEach(cap => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'flex items-center justify-between py-2';
                        
                        const selectOptions = Object.keys(statusOptions).map(key => 
                            `<option value="${key}" ${cap.status === key ? 'selected' : ''}>${statusOptions[key].label}</option>`
                        ).join('');

                        itemDiv.innerHTML = `
                            <span class="text-sm text-slate-700 flex-1 pr-2">${cap.name}</span>
                            <select data-id="${cap.id}" class="status-select text-sm rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500 w-40">
                                ${selectOptions}
                            </select>
                        `;
                        stageDiv.appendChild(itemDiv);
                    });
                    capabilitiesListContainer.appendChild(stageDiv);
                }
            });

            document.querySelectorAll('.status-select').forEach(select => {
                select.addEventListener('change', handleStatusChange);
            });
        }
        
        function getQuadraticBezierXY(t, p0, p1, p2) {
            const x = Math.pow(1 - t, 2) * p0.x + 2 * (1 - t) * t * p1.x + Math.pow(t, 2) * p2.x;
            const y = Math.pow(1 - t, 2) * p0.y + 2 * (1 - t) * t * p1.y + Math.pow(t, 2) * p2.y;
            return { x, y };
        }
        
        function getQuadraticBezierAngle(t, p0, p1, p2) {
            const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
            const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
            return Math.atan2(dy, dx) * (180 / Math.PI);
        }

        function renderRoadmap() {
            if (!graphCanvas || !graphCanvas.offsetWidth) {
                setTimeout(renderRoadmap, 50);
                return;
            }

            roadmapPointsContainer.innerHTML = '';
            stageElementsContainer.innerHTML = '';

            const totalPoints = capabilitiesData.length;
            const containerWidth = graphCanvas.offsetWidth;
            const containerHeight = graphCanvas.offsetHeight;

            // Pontos da curva de Bézier (início, controle, fim) - Curva mais horizontal e suave
            const p0 = { x: 40, y: containerHeight - 150 };
            const p1 = { x: containerWidth * 0.5, y: containerHeight - 50 };
            const p2 = { x: containerWidth - 40, y: 250 };
            
            const pathData = `M ${p0.x} ${p0.y} Q ${p1.x} ${p1.y} ${p2.x} ${p2.y}`;
            roadmapPath.setAttribute('d', pathData);

            // 1. Desenhar pontos e suas legendas
            capabilitiesData.forEach((cap, index) => {
                const point = document.createElement('div');
                point.id = `point-${cap.id}`;
                point.className = `w-5 h-5 rounded-full absolute border-2 cursor-pointer transition-all duration-300 ${statusOptions[cap.status].class}`;
                
                const t = (index + 0.5) / totalPoints;
                const coords = getQuadraticBezierXY(t, p0, p1, p2);

                point.style.left = `${coords.x}px`;
                point.style.top = `${coords.y}px`;
                point.style.transform = 'translate(-50%, -50%)';
                
                const label = document.createElement('div');
                // Alterna a classe da legenda para posicionar acima ou abaixo
                label.className = (index % 2 === 0) ? 'point-label-above' : 'point-label-below';
                label.textContent = cap.name;
                point.appendChild(label);

                roadmapPointsContainer.appendChild(point);
            });
            
            // 2. Mapear os índices de cada fase
            const stageInfo = stages.map(stageName => {
                const indices = capabilitiesData
                    .map((cap, i) => (cap.stage === stageName ? i : -1))
                    .filter(i => i !== -1);
                if (indices.length === 0) return null;
                return {
                    name: stageName,
                    firstIndex: indices[0],
                    lastIndex: indices[indices.length - 1],
                    middleIndex: indices[Math.floor(indices.length / 2)],
                };
            }).filter(Boolean);


            // 3. Desenhar títulos e linhas divisórias
            stageInfo.forEach((stage, i) => {
                // Título da fase
                const title_t = (stage.middleIndex + 0.5) / totalPoints;
                const titleCoords = getQuadraticBezierXY(title_t, p0, p1, p2);
                const titleEl = document.createElement('div');
                titleEl.className = 'main-stage-title';
                titleEl.textContent = stage.name.toUpperCase();
                // Aumenta a distância do título em relação à curva
                titleEl.style.left = `${titleCoords.x}px`;
                titleEl.style.top = `${titleCoords.y - 200}px`; 
                stageElementsContainer.appendChild(titleEl);

                // Linha divisória (exceto para a primeira fase)
                if (i > 0) {
                    const delimiter_t = (stage.firstIndex - 0.5) / totalPoints; 
                    const delimiterCoords = getQuadraticBezierXY(delimiter_t, p0, p1, p2);
                    const delimiterEl = document.createElement('div');
                    delimiterEl.className = 'stage-delimiter';
                    delimiterEl.style.left = `${delimiterCoords.x}px`;
                    delimiterEl.style.top = `${delimiterCoords.y - 100}px`;
                    stageElementsContainer.appendChild(delimiterEl);
                }
            });

            // 4. Posicionar o foguete
            const rocket_t = 1.02; // Levemente para fora da curva
            const rocketCoords = getQuadraticBezierXY(rocket_t, p0, p1, p2);
            const rocketAngle = getQuadraticBezierAngle(rocket_t, p0, p1, p2);
            rocketContainer.style.left = `${rocketCoords.x}px`;
            rocketContainer.style.top = `${rocketCoords.y}px`;
            rocketContainer.style.transform = `translate(-50%, -50%) rotate(${rocketAngle + 5}deg)`;
        }

        function handleStatusChange(event) {
            const capabilityId = event.target.dataset.id;
            const newStatus = event.target.value;

            const capability = capabilitiesData.find(c => c.id === capabilityId);
            if (capability) {
                capability.status = newStatus;
            }

            const point = document.getElementById(`point-${capabilityId}`);
            if (point) {
                point.classList.remove('status-nao-iniciado', 'status-em-andamento', 'status-realizado', 'status-atrasado');
                point.classList.add(statusOptions[newStatus].class);
            }
        }

        function init() {
            renderCapabilitiesList();
            renderRoadmap();
        }
        
        window.addEventListener('resize', renderRoadmap);
        window.onload = init;

    </script>
